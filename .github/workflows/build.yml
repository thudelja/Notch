name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the core
        run: dotnet test tests/SDBackup.Core.Tests -c Release --nologo

      - name: Build (x64)
        run: dotnet publish src/SDBackup.App/SDBackup.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64 --nologo

      - name: Self-test (opens every window with sample data; fails on XAML or binding errors)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'self-test'
          $process = Start-Process -FilePath dist/win-x64/Notch.exe -ArgumentList '--self-test', $out -Wait -PassThru
          Get-Content (Join-Path $out 'self-test.txt') -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)." }

      - name: Upload self-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test
          path: ${{ runner.temp }}/self-test
          if-no-files-found: ignore

      - name: Build (ARM64)
        run: dotnet publish src/SDBackup.App/SDBackup.App.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -o dist/win-arm64 --nologo

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Notch-Windows
          path: |
            windows/dist/win-x64/Notch.exe
            windows/dist/win-arm64/Notch.exe

  macos:
    name: Mac app
    # macOS minutes count ten times towards the free allowance, so this runs on main and on demand only.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test
